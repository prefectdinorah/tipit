name: Deploy to Staging

# 🎯 Цель: Автоматический деплой на staging при пуше в dev
# Триггер: Push в ветку dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch: # Ручной запуск из GitHub UI

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    
    steps:
      # 1. Получаем код из репозитория
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Проверка SSH подключения к серверу
      - name: � Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "✅ SSH connection successful!"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"

      # 3. Проверка GitHub SSH на сервере
      - name: 🔑 Test GitHub SSH Access
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "� Testing GitHub SSH connection..."
            ssh -T git@github.com 2>&1 || true
            echo "✅ GitHub SSH test completed"

      # 4. Pull кода с GitHub
      - name: 📥 Pull Latest Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/tipit/dev
            echo "📥 Fetching from GitHub..."
            git fetch origin
            echo "� Resetting to origin/dev..."
            git reset --hard origin/dev
            echo "✅ Code updated to: $(git rev-parse --short HEAD)"

      # 5. Установка зависимостей
      - name: 📦 Install Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/tipit/dev
            echo "📦 Installing npm packages..."
            npm install --legacy-peer-deps
            echo "✅ Dependencies installed"

      # 6. Генерация Prisma Client
      - name: 🔨 Generate Prisma Client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/tipit/dev
            echo "🔨 Generating Prisma Client..."
            npm run prisma:generate
            echo "✅ Prisma Client generated"

      # 7. Миграции базы данных
      - name: 🗄️ Run Database Migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/tipit/dev
            echo "🗄️ Running database migrations..."
            npm run prisma:migrate
            echo "✅ Migrations completed"

      # 8. Сборка приложения
      - name: 🏗️ Build Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/tipit/dev
            echo "🏗️ Building Next.js application..."
            npm run build
            echo "✅ Build completed"

      # 9. Перезапуск PM2
      - name: ♻️ Restart PM2 Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "♻️ Restarting PM2 process..."
            pm2 restart tipit-dev || pm2 start npm --name "tipit-dev" -- start -- -p 3001
            pm2 save
            echo "✅ PM2 process restarted"
            pm2 status tipit-dev

      # 3. Уведомление об успешном деплое
      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Staging deployed successfully!"
          echo "🌐 URL: https://dev.tipit.yourdomain.com"

      # 4. Уведомление об ошибке
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Staging deployment failed!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
