# 🎯 Nginx конфигурация для Staging
# Файл: /etc/nginx/sites-available/tipit-staging
# Домен: dev.tipit.yourdomain.com или IP:8080

server {
    listen 8080;
    listen [::]:8080;
    
    # Замените на ваш staging домен или используйте IP:8080
    server_name dev.tipit.yourdomain.com;
    # Если нет домена: server_name 45.144.52.219;
    
    # Логи
    access_log /var/log/nginx/tipit-staging-access.log;
    error_log /var/log/nginx/tipit-staging-error.log;
    
    # Основной прокси на Next.js (PM2 на порту 3001)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Настройки кэша
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Статические файлы Next.js
    location /_next/static {
        proxy_pass http://localhost:3001;
        # Для staging кэшируем меньше
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Загруженные файлы (аватары и т.д.)
    location /uploads {
        alias /var/www/tipit-staging/public/uploads;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Безопасность
    server_tokens off;
    
    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;
    
    # Баннер для staging окружения
    add_header X-Environment "Staging";
}
