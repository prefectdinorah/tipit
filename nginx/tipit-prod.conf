# 🎯 Nginx конфигурация для Production
# Файл: /etc/nginx/sites-available/tipit-prod
# Домен: tipit.yourdomain.com или IP:80

server {
    listen 80;
    listen [::]:80;
    
    # Замените на ваш домен или используйте IP
    server_name tipit.yourdomain.com;
    # Если нет домена: server_name 45.144.52.219;
    
    # Логи
    access_log /var/log/nginx/tipit-prod-access.log;
    error_log /var/log/nginx/tipit-prod-error.log;
    
    # Основной прокси на Next.js (PM2 на порту 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support (для будущих real-time функций)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Настройки кэша
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Статические файлы Next.js (оптимизация)
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Загруженные файлы (аватары и т.д.)
    location /uploads {
        alias /var/www/tipit-prod/public/uploads;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    
    # Безопасность: скрываем версию nginx
    server_tokens off;
    
    # Максимальный размер загружаемых файлов (для аватаров)
    client_max_body_size 10M;
}

