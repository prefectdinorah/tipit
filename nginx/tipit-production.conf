# Nginx конфигурация для PRODUCTION окружения (MAIN ветка)
# Файл: /etc/nginx/sites-available/tipit-production.conf
# Проксирует запросы на Next.js приложение на порту 3000

server {
    listen 80;
    listen [::]:80;
    
    # Домен для production окружения
    # Замените на ваш реальный домен
    server_name tipit.local www.tipit.local 45.144.52.219;
    
    # Логи для production
    access_log /var/log/nginx/tipit-production-access.log;
    error_log /var/log/nginx/tipit-production-error.log;
    
    # Максимальный размер загружаемых файлов (для аватаров)
    client_max_body_size 10M;
    
    # Основная локация - проксирование на Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket поддержка (на случай будущих фич)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Передача информации о клиенте
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Статические файлы Next.js с агрессивным кешированием
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Загруженные файлы (аватары и т.д.)
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "PRODUCTION OK\n";
        add_header Content-Type text/plain;
    }
    
    # Сжатие для улучшения производительности
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}

